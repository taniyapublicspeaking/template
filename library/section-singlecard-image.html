<!-- =====================================================
     SECTION: SINGLE CARD WITH OPTIONAL VISUAL
====================================================== -->

<section id="single-card" class="single-card-section">

    <div class="container">

        <!-- Section Header -->
        <header class="section-header">

            <h2 class="section-title">
                Section Title
            </h2>

            <p class="section-description">
                Introduce this section with a short description.
            </p>

        </header>


        <!-- Single Card Wrapper -->
        <div class="single-card-wrapper">

            <!--
                Choose a card layout:

                single-card--icon
                single-card--image
                single-card--text
            -->

            <article class="single-card single-card--icon">

                <!-- Optional Icon Area -->
                <div class="single-card-visual">

                    <!-- Replace this symbol with your preferred icon -->
                    <span class="single-card-icon" aria-hidden="true">
                        ✦
                    </span>

                </div>


                <!-- Card Content -->
                <div class="single-card-content">

                    <h3 class="single-card-title">
                        Your Card Title
                    </h3>

                    <p class="single-card-description">
                        Add your card description here. Explain
                        the feature, service, resource, or topic
                        you want visitors to discover.
                    </p>

                    <a
                        href="#"
                        class="single-card-link"
                    >
                        Learn More
                        <span aria-hidden="true">→</span>
                    </a>

                </div>

            </article>

        </div>

    </div>

</section>

<!-- END SINGLE-CARD SECTION -->
